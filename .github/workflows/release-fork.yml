# AI: below section was generated by an AI
name: Publish Release

# For forks: builds the release firmware of the selected branch and publishes it as a normal (non-pre-release) GitHub
# release tagged "v<version in package.json>". As the latest release it is what the "update from GitHub" button on
# the device's update page offers: that page looks for the asset "WLED_<tag without v>_<release name>.bin" in releases/latest.
# Run it from the Actions tab ("Run workflow", choose the branch), once CI on that branch is green.
# Running it again for the same version replaces the release; bump "version" in package.json for a new one.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-fork

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wled_build:
    # wled/WLED publishes its releases with release.yml
    if: github.repository != 'wled/WLED' && github.ref_type == 'branch'
    uses: ./.github/workflows/build.yml
    with:
      release: true

  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: wled_build
    permissions:
      contents: write # replace the release and its tag
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: Replace the release of this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          cd firmware
          files=(*.bin *.bin.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "No firmware files found"; exit 1; fi
          ls -la "${files[@]}"
          VERSION=$(jq -r .version ../package.json)
          TAG="v$VERSION"
          for f in "${files[@]}"; do
            case "$f" in WLED_${VERSION}_*) ;; *) echo "::error::$f does not start with WLED_${VERSION}_"; exit 1;; esac
          done
          printf '%s\n' \
            "Build of branch \`$BRANCH\`, commit $SHA, built $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "Not an official WLED release: not reviewed by the WLED team. Devices built from this repository offer it on the update page (\"update from GitHub\"); you can also download the .bin file for your board (for example \`ESP32\`) and upload it there." \
            > notes.md
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || echo "No previous release $TAG"
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --latest \
            --title "$VERSION ($BRANCH)" --notes-file notes.md "${files[@]}"
# AI: end
