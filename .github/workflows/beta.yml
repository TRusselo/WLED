name: Deploy Beta

# For forks: publishes the firmware of one branch as a rolling GitHub pre-release ("beta-<branch>"),
# so testers can download it without signing in and the files do not expire like CI artifacts.
# Run it from the Actions tab ("Run workflow", choose the branch), once CI on that branch is green.
# Each run replaces the previous beta of the same branch.
# Pre-releases are never the "latest" release, so the update check on devices (update.htm, releases/latest) does not offer them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wled_build:
    # wled/WLED publishes nightly builds instead (nightly.yml); betas are for branches, not tags
    if: github.repository != 'wled/WLED' && github.ref_type == 'branch'
    uses: ./.github/workflows/build.yml

  beta:
    name: Publish beta pre-release
    runs-on: ubuntu-24.04
    needs: wled_build
    permissions:
      contents: write # replace the release and its tag
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Replace the beta pre-release of this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          files=(*.bin *.bin.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "No firmware files found"; exit 1; fi
          ls -la "${files[@]}"
          TAG="beta-${BRANCH//\//-}"
          printf '%s\n' \
            "Unstable test build of branch \`$BRANCH\`, commit $SHA, built $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "For testing only: not reviewed and not an official WLED release. Each run of the \"Deploy Beta\" workflow replaces this pre-release." \
            "" \
            "To install, download the .bin file for your board (for example \`ESP32\` for most ESP32 boards) and upload it on the device's update page." \
            > notes.md
          # delete the previous beta and its tag (the tag then moves to the new commit)
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || echo "No previous release $TAG"
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --prerelease \
            --title "Beta: $BRANCH (unstable)" --notes-file notes.md "${files[@]}"
# AI: end
