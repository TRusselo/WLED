name: Sync with upstream

# For forks: merges wled/WLED main into this repository's main (like the "Sync fork" button on GitHub),
# then builds the result and publishes it as the rolling pre-release "nightly" (Deploy Nightly workflow, beta.yml).
# Runs once a day and from the Actions tab ("Run workflow"); does nothing when upstream has no new commits.
# A merge conflict fails this workflow; resolve it by hand (Sync fork on GitHub, or a local merge).
# Upstream changes to files in .github/workflows can only be merged with a token that has the "workflows"
# permission: add a fine-grained personal access token with Contents and Workflows (read and write) on this
# repository as the secret SYNC_TOKEN. Without it, GITHUB_TOKEN is used and such merges fail.
on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream

jobs:
  sync:
    name: Merge upstream and build
    if: github.repository != 'wled/WLED'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # merge into main
      actions: write  # start the Deploy Nightly workflow
    steps:
      - name: Merge wled/WLED main into main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! out=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch=main 2>&1); then
            echo "::error::Could not merge wled/WLED main into main: $out"
            exit 1
          fi
          echo "$out"
          echo "type=$(jq -r '.merge_type' <<< "$out")" >> "$GITHUB_OUTPUT"
      - name: Build and publish nightly
        if: steps.merge.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run beta.yml --repo "$REPO" --ref main
